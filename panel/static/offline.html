<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0e0f13">
<title>gen-center can't be reached</title>
<!-- Shown by the phone app's service worker (sw.js) in place of a page when the panel can't be reached, at that page's
     own address: everything it needs is in here, as nothing else can be fetched. It tries again by itself every
     15 s, as the app comes back to the front (after turning Tailscale on) and as the phone gets a connection; once the
     panel answers, the page that was asked for loads. -->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e0f13; color: #e8eaf0;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
  main { width: 100%; max-width: 340px; text-align: center; }
  h1 { font-size: 1.2rem; margin: 0 0 8px; }
  p { color: #969cae; margin: 0 0 20px; font-size: .92rem; }
  .actions { display: grid; gap: 10px; }
  button, a.button { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px 16px;
    border-radius: 10px; border: 1px solid #2a2e3c; background: #1e212c; color: #e8eaf0; font: inherit; font-weight: 600;
    text-decoration: none; cursor: pointer; box-sizing: border-box; }
  button.primary { background: #a07cff; border-color: #a07cff; color: #0e0f13; }
  button:disabled { opacity: .75; cursor: default; }
  .spinner { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
    animation: spin .8s linear infinite; display: none; }
  button.busy .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .state { min-height: 2.6em; margin: 14px 0 0; font-size: .85rem; color: #969cae; }
  .state.ok { color: #3ecf8e; }
  .state.bad { color: #e8b84a; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>The panel can't be reached</h1>
  <p id="why">Check that the PC is on and the panel is running. Away from home, Tailscale has to be connected on this phone.</p>
  <div class="actions">
    <button type="button" class="primary" id="retry"><span class="spinner" aria-hidden="true"></span><span id="retryLabel">Try again</span></button>
    <!-- Opens the Tailscale app (Android), or its Play Store page if it isn't installed. -->
    <a class="button" id="tailscale" href="intent:#Intent;package=com.tailscale.ipn;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.tailscale.ipn;end" hidden>Open Tailscale</a>
  </div>
  <div class="state" id="state" role="status" aria-live="polite">Trying again by itself every 15 seconds.</div>
</main>
<script>
(() => {
  const EVERY = 15000, WAIT = 8000;
  const retry = document.getElementById('retry'), label = document.getElementById('retryLabel'), state = document.getElementById('state');
  let trying = false, timer = 0;
  if (/Android/i.test(navigator.userAgent)) document.getElementById('tailscale').hidden = false;
  const clock = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  function say(text, kind) { state.textContent = text; state.className = 'state' + (kind ? ' ' + kind : ''); }
  // The panel's manifest: small, and it answers without signing in. Past the service worker (only pages go through it).
  async function attempt() {
    if (trying) return;
    clearTimeout(timer);
    trying = true;
    retry.disabled = true;
    retry.classList.add('busy');
    label.textContent = 'Trying…';
    say(navigator.onLine === false ? 'This phone has no connection right now. Trying anyway…' : 'Reaching the panel…');
    const stop = new AbortController(), giveUp = setTimeout(() => stop.abort(), WAIT);
    try {
      const reply = await fetch('/manifest.webmanifest', { cache: 'no-store', signal: stop.signal });
      if (!reply.ok) throw new Error(String(reply.status));
      say('Connected. Opening the panel…', 'ok');
      label.textContent = 'Opening…';
      location.reload();
      return;
    } catch (e) {
      say((navigator.onLine === false ? 'This phone has no connection.' : 'Still can\'t reach the panel.')
        + ` Tried at ${clock()}; trying again by itself in 15 seconds.`, 'bad');
    } finally {
      clearTimeout(giveUp);
    }
    trying = false;
    retry.disabled = false;
    retry.classList.remove('busy');
    label.textContent = 'Try again';
    timer = setTimeout(attempt, EVERY);
  }
  retry.addEventListener('click', attempt);
  // Back from the Tailscale app, or a connection again: no need to tap.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) attempt(); });
  window.addEventListener('online', attempt);
  timer = setTimeout(attempt, EVERY);
})();
</script>
</body>
</html>
